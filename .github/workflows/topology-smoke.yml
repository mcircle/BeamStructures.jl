name: Topology study smoke test

on:
  pull_request:
    paths:
      - 'src/**'
      - 'validation/**'
      - 'test/**'
      - '.github/workflows/topology-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      BEAM_TOPOLOGY_SMOKE_OUTPUT: validation/results/smoke
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.1'
      - uses: julia-actions/cache@v2
      - name: Instantiate validation environment
        shell: julia --project=validation {0}
        run: |
          using Pkg
          Pkg.Registry.add("General")
          Pkg.develop(path=".")
          Pkg.instantiate()
      - name: Run topology smoke study
        run: julia --project=validation validation/run_topology_smoke.jl
      - name: Inspect reported failures
        if: always()
        run: |
          find validation/results/smoke -name '*.csv' -print -exec awk -F, 'NR == 1 { for (i=1; i<=NF; i++) { if ($i == "status") status=i; if ($i == "message") message=i } } NR > 1 && status && $status == "\"failed\"" { print FILENAME ":" NR ": status=" $status ", message=" $message; failures=1 } END { exit failures }' {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-smoke-csv
          path: validation/results/smoke
          if-no-files-found: error
